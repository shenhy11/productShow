# 官网前台 - www.zioncom.net
server {
    listen 80;
    server_name www.zioncom.net localhost;

    # 将 HTTP 重定向到 HTTPS（生产环境启用，本地开发注释掉）
    # return 301 https://$host$request_uri;

    # ---- 本地开发时使用以下配置 ----

    # 前台 Nuxt SSR 服务
    location / {
        proxy_pass http://nuxt-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 管理后台 - admin.zioncom.net
server {
    listen 80;
    server_name admin.zioncom.net;

    # Admin 前台静态文件（构建产物）
    root /usr/share/nginx/admin;
    index index.html;

    # SPA 路由支持（所有路由回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# API 服务 - api.zioncom.net（内部路由可选）
server {
    listen 80;
    server_name api.zioncom.net;

    location / {
        proxy_pass http://spring-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 配置（前台 SSR 服务器端请求无需 CORS，浏览器端请求需要）
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
