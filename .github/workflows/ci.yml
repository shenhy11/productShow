name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/*
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: cd zioncom-server && mvn -B clean package -DskipTests

  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: zioncom-admin/package-lock.json

      - name: Install dependencies
        run: cd zioncom-admin && npm ci

      - name: Build Admin
        run: cd zioncom-admin && npm run build:prod

  build-nuxt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: zioncom-nuxt/package-lock.json

      - name: Install dependencies
        run: cd zioncom-nuxt && npm ci

      - name: Build Nuxt APP
        run: cd zioncom-nuxt && npm run build
