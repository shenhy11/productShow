# 生产环境覆写配置
# 使用方式: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
version: '3.8'

services:
  mysql:
    ports: []  # 生产环境不对外暴露数据库端口

  redis:
    ports: []  # 生产环境不对外暴露 Redis 端口

  spring-api:
    ports: []  # 生产环境通过 Nginx 代理，不直接暴露
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  nuxt-app:
    ports: []  # 生产环境通过 Nginx 代理，不直接暴露
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M

  nginx:
    restart: always
