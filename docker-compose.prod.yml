version: '3'

services:
  zioncom-server:
    build:
      context: ./zioncom-server
      dockerfile: Dockerfile
    image: zioncom-server:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "8080:8080"
    restart: always
    networks:
      - zioncom-net

  zioncom-nuxt:
    build:
      context: ./zioncom-nuxt
      dockerfile: Dockerfile
    image: zioncom-nuxt:latest
    environment:
      - NUXT_PUBLIC_API_BASE=${API_BASE_URL}
    ports:
      - "3000:3000"
    restart: always
    networks:
      - zioncom-net

  zioncom-admin:
    build:
      context: ./zioncom-admin
      dockerfile: Dockerfile
    image: zioncom-admin:latest
    ports:
      - "80:80"
    restart: always
    networks:
      - zioncom-net

networks:
  zioncom-net:
    driver: bridge
